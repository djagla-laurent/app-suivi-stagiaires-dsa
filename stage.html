<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Informations sur le stage</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="page narrow">
    <h1>Informations sur votre stage</h1>
    <p id="intro" class="note" hidden></p>

    <section id="vue-form" hidden>
      <form id="form" class="card" autocomplete="off">
        <label>Nom et prénoms
          <input id="nom" required maxlength="200">
        </label>
        <label>Université
          <input id="universite" required maxlength="200">
        </label>
        <label>Filière
          <input id="filiere" required maxlength="150">
        </label>
        <label>Niveau de formation
          <select id="niveau" required>
            <option value="">-- Choisir --</option>
            <option value="L1">L1</option>
            <option value="L2">L2</option>
            <option value="L3">L3</option>
            <option value="M1">M1</option>
            <option value="M2">M2</option>
            <option value="DEAT">DEAT</option>
            <option value="Doctorat">Doctorat</option>
          </select>
        </label>
        <label>Type de stage
          <select id="type" required>
            <option value="">-- Choisir --</option>
            <option value="Académique">Académique</option>
            <option value="Professionnel">Professionnel</option>
          </select>
        </label>
        <div class="ligne">
          <label>Date de début
            <input id="debut" type="date" required>
          </label>
          <label>Date de fin
            <input id="fin" type="date" required>
          </label>
        </div>
        <label>Objectif de stage
          <textarea id="but" rows="4" required maxlength="1000"></textarea>
        </label>
        <button type="submit" id="envoyer" class="principal">Enregistrer mon stage</button>
        <p id="message" class="message" role="status"></p>
      </form>
    </section>

    <section id="vue-aucun" class="card" hidden>
      <p id="txt-aucun">Aucun stage n'est rattaché à votre compte. Contactez l'administration.</p>
    </section>

    <div class="liens-bas"><a id="retour" class="btn-lien retour" href="espace.html">Retour à mon espace</a></div>
  </main>

  <script src="supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="commun.js"></script>
  <script>
    // "completer" : stage enregistré par l'administrateur, le stagiaire complète ses informations.
    // "nouveau"   : stagiaire déjà rattaché qui déclare un nouveau stage.
    let mode = null;

    (async () => {
      const { data } = await db.auth.getSession();
      if (!data.session) { location.replace("connexion.html"); return; }

      const { data: stages, error } = await db.from("stages")
        .select("*")
        .eq("user_id", data.session.user.id)
        .order("date_debut", { ascending: false });
      if (error) {
        console.error(error);
        $("txt-aucun").textContent = "Impossible de charger vos informations. Réessayez plus tard.";
        $("vue-aucun").hidden = false;
        return;
      }
      if (!stages.length) { $("vue-aucun").hidden = false; return; }

      $("nom").readOnly = true;
      const aCompleter = stages.find((s) => !s.filiere);
      if (aCompleter) {
        mode = "completer";
        $("nom").value = aCompleter.nom_prenoms;
        $("type").value = aCompleter.type_stage;
        $("debut").value = aCompleter.date_debut;
        $("fin").value = aCompleter.date_fin;
        ["type", "debut", "fin"].forEach((id) => { $(id).disabled = true; });
        $("intro").textContent = "L'administration a enregistré votre stage. Complétez vos informations pour accéder à votre espace.";
        $("intro").hidden = false;
        $("envoyer").textContent = "Enregistrer mes informations";
        $("retour").hidden = true;
      } else {
        mode = "nouveau";
        $("nom").value = stages[0].nom_prenoms;
        $("filiere").value = stages[0].filiere;
        $("universite").value = stages[0].universite || "";
      }
      $("vue-form").hidden = false;
    })();

    // Message immédiat si la date de fin est antérieure à la date de début.
    // (Pas d'attribut "min" sur la date de fin : le navigateur bloquerait l'envoi avec son propre message.)
    const messageDates = "La date de fin ne peut pas être antérieure à la date de début.";
    function verifierDates() {
      const mauvais = $("debut").value && $("fin").value && $("fin").value < $("debut").value;
      if (mauvais) dire("message", messageDates, "erreur");
      else if ($("message").textContent === messageDates) dire("message", "");
    }
    $("fin").addEventListener("change", verifierDates);

    // Nouveau stage : date de fin proposée automatiquement (début + 1 mois en Académique, + 3 mois en Professionnel).
    const moisDuType = () => ($("type").value.trim().toLowerCase().startsWith("prof") ? 3 : 1);
    let finAuto = "";
    $("debut").addEventListener("change", () => {
      if (mode !== "nouveau" || !$("debut").value) return;
      finAuto = ajouterMoisIso($("debut").value, moisDuType());
      $("fin").value = finAuto;
      verifierDates();
    });
    // Si on change le type après coup, on ajuste la fin seulement si elle n'a pas été modifiée à la main.
    $("type").addEventListener("change", () => {
      if (mode !== "nouveau" || !$("debut").value) return;
      if ($("fin").value && $("fin").value !== finAuto) return;
      finAuto = ajouterMoisIso($("debut").value, moisDuType());
      $("fin").value = finAuto;
    });

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      dire("message", "");

      if (mode === "completer") {
        $("envoyer").disabled = true;
        const { error } = await db.rpc("completer_stage", {
          p_filiere: $("filiere").value,
          p_niveau: $("niveau").value,
          p_universite: $("universite").value,
          p_but: $("but").value
        });
        $("envoyer").disabled = false;
        if (error) {
          console.error(error);
          dire("message", messageErreur(error), "erreur");
          return;
        }
        location.href = "espace.html";
        return;
      }

      if (mode !== "nouveau") return;
      if ($("fin").value < $("debut").value) {
        dire("message", messageDates, "erreur");
        return;
      }

      $("envoyer").disabled = true;
      const { error } = await db.rpc("enregistrer_stage", {
        p_nom: $("nom").value,
        p_filiere: $("filiere").value,
        p_niveau: $("niveau").value,
        p_universite: $("universite").value,
        p_type: $("type").value,
        p_but: $("but").value,
        p_debut: $("debut").value,
        p_fin: $("fin").value
      });
      $("envoyer").disabled = false;
      if (error) {
        console.error(error);
        dire("message", messageErreur(error), "erreur");
        return;
      }
      location.href = "espace.html";
    });
  </script>
</body>
</html>
