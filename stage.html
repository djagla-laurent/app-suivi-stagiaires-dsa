<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Informations sur le stage</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="page narrow">
    <h1>Informations sur votre stage</h1>

    <section id="vue-form">
      <form id="form" class="card" autocomplete="off">
        <label>Nom et prénoms
          <input id="nom" required maxlength="200">
        </label>
        <label>Filière d'étude
          <input id="filiere" required maxlength="150">
        </label>
        <label>Université d'étude
          <input id="universite" required maxlength="200">
        </label>
        <label>Type de stage
          <select id="type" required>
            <option value="">-- Choisir --</option>
            <option value="Académique">Académique</option>
            <option value="Professionnel">Professionnel</option>
          </select>
        </label>
        <div class="ligne">
          <label>Date de début
            <input id="debut" type="date" required>
          </label>
          <label>Date de fin
            <input id="fin" type="date" required>
          </label>
        </div>
        <label>Objectif du stage
          <textarea id="but" rows="4" required maxlength="1000"></textarea>
        </label>
        <div class="piege" aria-hidden="true">
          <label>Ne pas remplir <input id="site" tabindex="-1" autocomplete="off"></label>
        </div>
        <button type="submit" id="envoyer" class="principal">Enregistrer mon stage</button>
        <p id="message" class="message" role="status"></p>
      </form>
    </section>

    <section id="vue-code" class="card" hidden>
      <h2>Votre stage est enregistré</h2>
      <p>Voici votre code de rattachement. Il vous sera demandé pour créer votre compte stagiaire.</p>
      <p id="code" class="code"></p>
      <button id="btn-compte" class="principal">Créer mon compte stagiaire</button>
    </section>

    <div class="liens-bas"><a id="retour" class="btn-lien retour" href="index.html">Retour à l'accueil</a></div>
  </main>

  <script src="supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="commun.js"></script>
  <script>
    let connecte = false;

    // Connecté : retour vers l'espace et préremplissage pour un renouvellement.
    (async () => {
      const { data } = await db.auth.getSession();
      if (!data.session) return;
      connecte = true;
      $("retour").textContent = "Retour à mon espace";
      $("retour").href = "espace.html";
      const { data: dernier } = await db.from("stages")
        .select("nom_prenoms, filiere, universite")
        .eq("user_id", data.session.user.id)
        .order("date_debut", { ascending: false })
        .limit(1);
      if (dernier && dernier.length) {
        $("nom").value = dernier[0].nom_prenoms;
        $("filiere").value = dernier[0].filiere;
        $("universite").value = dernier[0].universite || "";
      }
    })();

    // Message immédiat si la date de fin est antérieure à la date de début.
    // (Pas d'attribut "min" sur la date de fin : le navigateur bloquerait l'envoi avec son propre message.)
    const messageDates = "La date de fin ne peut pas être antérieure à la date de début.";
    function verifierDates() {
      const mauvais = $("debut").value && $("fin").value && $("fin").value < $("debut").value;
      if (mauvais) dire("message", messageDates, "erreur");
      else if ($("message").textContent === messageDates) dire("message", "");
    }
    $("fin").addEventListener("change", verifierDates);

    // Date de fin proposée automatiquement : début + 1 mois (Académique) ou + 3 mois (Professionnel).
    // Si le mois d'arrivée est plus court, on prend son dernier jour (31/01 + 1 mois = 28/02).
    function ajouterMois(iso, n) {
      const [a, m, j] = iso.split("-").map(Number);
      const total = (m - 1) + n;
      const an = a + Math.floor(total / 12);
      const mois = total % 12;
      const dernier = new Date(Date.UTC(an, mois + 1, 0)).getUTCDate();
      return an + "-" + String(mois + 1).padStart(2, "0") + "-" + String(Math.min(j, dernier)).padStart(2, "0");
    }
    const moisDuType = () => ($("type").value.trim().toLowerCase().startsWith("prof") ? 3 : 1);
    let finAuto = "";
    $("debut").addEventListener("change", () => {
      if (!$("debut").value) return;
      finAuto = ajouterMois($("debut").value, moisDuType());
      $("fin").value = finAuto;
      verifierDates();
    });
    // Si on change le type après coup, on ajuste la fin seulement si elle n'a pas été modifiée à la main.
    $("type").addEventListener("change", () => {
      if (!$("debut").value) return;
      if ($("fin").value && $("fin").value !== finAuto) return;
      finAuto = ajouterMois($("debut").value, moisDuType());
      $("fin").value = finAuto;
    });
    $("btn-compte").addEventListener("click", () => { location.href = "inscription.html"; });

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      dire("message", "");

      if ($("site").value) { dire("message", "Enregistré.", "ok"); return; } // anti-robot

      if ($("fin").value < $("debut").value) {
        dire("message", "La date de fin ne peut pas être antérieure à la date de début.", "erreur");
        return;
      }

      $("envoyer").disabled = true;
      const { data, error } = await db.rpc("enregistrer_stage", {
        p_nom: $("nom").value,
        p_filiere: $("filiere").value,
        p_universite: $("universite").value,
        p_type: $("type").value,
        p_but: $("but").value,
        p_debut: $("debut").value,
        p_fin: $("fin").value
      });
      $("envoyer").disabled = false;

      if (error) {
        console.error(error);
        dire("message", messageErreur(error), "erreur");
        return;
      }

      if (connecte) {
        location.href = "espace.html";
        return;
      }
      localStorage.setItem("code_stage", data);
      $("code").textContent = formaterCode(data);
      $("vue-form").hidden = true;
      $("vue-code").hidden = false;
    });
  </script>
</body>
</html>
