<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace administrateur</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="page">

    <!-- Connexion -->
    <section id="vue-connexion" style="max-width:420px;margin:40px auto;">
      <h1>Espace administrateur</h1>
      <form id="form-connexion" class="card">
        <label>Adresse e-mail
          <input id="email" type="email" required autocomplete="username">
        </label>
        <label>Mot de passe
          <input id="mdp" type="password" required autocomplete="current-password">
        </label>
        <button type="submit" id="btn-connexion" class="principal">Se connecter</button>
        <p id="msg-connexion" class="message" role="status"></p>
      </form>
      <div class="liens-bas"><a class="btn-lien retour" href="index.html">Retour à l'accueil</a></div>
    </section>

    <!-- Tableau de bord -->
    <section id="vue-admin" hidden>
      <div class="entete">
        <h1>Stages enregistrés</h1>
        <div>
          <a href="suivi.html" style="margin-right:12px;">Mouvements et bilans</a>
          <a href="index.html" style="margin-right:12px;">Accueil</a>
          <button id="btn-deconnexion">Se déconnecter</button>
        </div>
      </div>

      <div class="outils">
        <label>Recherche
          <input id="recherche" type="search" placeholder="Nom, filière, université, type, but">
        </label>
        <label>Situation
          <select id="filtre-situation">
            <option value="">Toutes</option>
            <option value="en_cours">En cours</option>
            <option value="a_venir">À venir</option>
            <option value="termine">Terminés</option>
          </select>
        </label>
        <label>Période du
          <input id="date-debut" type="date">
        </label>
        <label>au
          <input id="date-fin" type="date">
        </label>
        <button id="btn-effacer">Effacer les filtres</button>
        <button id="btn-actualiser">Actualiser</button>
        <button id="btn-export" class="principal">Exporter vers Excel (CSV)</button>
      </div>

      <p id="compteur" class="compteur"></p>
      <div class="tableau large">
        <table>
          <thead>
            <tr>
              <th>Nom et prénoms</th><th>Université</th><th>Filière</th><th>Niveau</th><th>Type de stage</th>
              <th>Début</th><th>Fin</th><th>Situation</th><th>Objectif de stage</th><th>Compte</th><th></th>
            </tr>
          </thead>
          <tbody id="corps"></tbody>
        </table>
        <p id="vide" class="vide" hidden>Aucun stage ne correspond à ces critères.</p>
      </div>
      <p id="msg-admin" class="message" role="status"></p>
    </section>
  </main>

  <dialog id="dialogue">
    <h2>Modifier l'enregistrement</h2>
    <form id="form-edition">
      <label>Nom et prénoms <input id="e-nom" required maxlength="200"></label>
      <label>Université <input id="e-universite" maxlength="200"></label>
      <label>Filière <input id="e-filiere" required maxlength="150"></label>
      <label>Niveau de formation
        <select id="e-niveau">
          <option value="">Non renseigné</option>
          <option value="L1">L1</option>
          <option value="L2">L2</option>
          <option value="L3">L3</option>
          <option value="M1">M1</option>
          <option value="M2">M2</option>
        </select>
      </label>
      <label>Type de stage <input id="e-type" required maxlength="100"></label>
      <label>Date de début <input id="e-debut" type="date" required></label>
      <label>Date de fin <input id="e-fin" type="date" required></label>
      <label>Objectif de stage <textarea id="e-but" rows="4" required maxlength="1000"></textarea></label>
      <div class="boutons">
        <button type="button" id="e-annuler">Annuler</button>
        <button type="submit" class="principal">Enregistrer les modifications</button>
      </div>
    </form>
  </dialog>

  <script src="supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="commun.js"></script>
  <script>
    let donnees = [];
    let idEdition = null;

    const SITUATIONS = { en_cours: ["En cours", "ok"], a_venir: ["À venir", "attente"], termine: ["Terminé", "neutre"] };
    function situationDe(s) {
      const t = aujourdhui();
      return t < s.date_debut ? "a_venir" : t > s.date_fin ? "termine" : "en_cours";
    }

    /* ---------- Connexion ---------- */
    async function afficherSelonSession() {
      const { data } = await db.auth.getSession();
      let connecte = !!data.session;
      if (connecte) {
        const { data: estAdmin } = await db.rpc("est_admin");
        if (estAdmin !== true) {
          await db.auth.signOut();
          connecte = false;
          dire("msg-connexion", "Ce compte n'a pas accès à l'espace administrateur.", "erreur");
        }
      }
      $("vue-connexion").hidden = connecte;
      $("vue-admin").hidden = !connecte;
      if (connecte) charger();
    }

    $("form-connexion").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("btn-connexion").disabled = true;
      dire("msg-connexion", "");
      const { error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("mdp").value
      });
      $("btn-connexion").disabled = false;
      if (error) {
        console.error(error);
        dire("msg-connexion", messageErreur(error), "erreur");
        return;
      }
      $("mdp").value = "";
      afficherSelonSession();
    });

    $("btn-deconnexion").addEventListener("click", async () => {
      await db.auth.signOut();
      donnees = [];
      afficherSelonSession();
    });

    /* ---------- Données ---------- */
    async function charger() {
      dire("msg-admin", "");
      const { data, error } = await db.from("stages").select("*").order("date_debut", { ascending: false });
      if (error) {
        console.error(error);
        dire("msg-admin", "Impossible de charger les données.", "erreur");
        return;
      }
      donnees = data;
      afficherTableau();
    }

    function lignesFiltrees() {
      const q = $("recherche").value.trim().toLowerCase();
      const du = $("date-debut").value;
      const au = $("date-fin").value;
      const sit = $("filtre-situation").value;
      return donnees.filter((s) => {
        if (sit && situationDe(s) !== sit) return false;
        if (du && s.date_fin < du) return false;   // stage terminé avant la période
        if (au && s.date_debut > au) return false; // stage commencé après la période
        if (!q) return true;
        return [s.nom_prenoms, s.filiere, s.niveau, s.universite, s.type_stage, s.but_stage].join(" ").toLowerCase().includes(q);
      });
    }

    function cellule(tr, texte, classe) {
      const td = document.createElement("td");
      td.textContent = texte;
      if (classe) td.className = classe;
      tr.appendChild(td);
    }

    function afficherTableau() {
      const lignes = lignesFiltrees();
      const corps = $("corps");
      corps.replaceChildren();

      lignes.forEach((s) => {
        const tr = document.createElement("tr");
        cellule(tr, s.nom_prenoms);
        cellule(tr, s.universite || "—");
        cellule(tr, s.filiere);
        cellule(tr, s.niveau || "—");
        cellule(tr, s.type_stage);
        cellule(tr, dateFr(s.date_debut));
        cellule(tr, dateFr(s.date_fin));

        const tdSit = document.createElement("td");
        const [libelleSit, tonSit] = SITUATIONS[situationDe(s)];
        tdSit.appendChild(pastille(libelleSit, tonSit));
        tr.appendChild(tdSit);

        cellule(tr, s.but_stage, "long");

        const tdCompte = document.createElement("td");
        const pile = document.createElement("div");
        pile.className = "pastilles";
        if (s.user_id) {
          pile.appendChild(pastille("Compte créé", "ok"));
        } else {
          pile.appendChild(pastille("Pas de compte", "attente"));
          if (s.code_rattachement) {
            const code = document.createElement("div");
            code.className = "mouv-detail";
            code.textContent = "Code " + formaterCode(s.code_rattachement);
            pile.appendChild(code);
          }
        }
        tdCompte.appendChild(pile);
        tr.appendChild(tdCompte);

        const td = document.createElement("td");
        td.className = "actions";
        const modif = document.createElement("button");
        modif.textContent = "Modifier";
        modif.addEventListener("click", () => ouvrirEdition(s));
        const suppr = document.createElement("button");
        suppr.textContent = "Supprimer";
        suppr.className = "danger";
        suppr.addEventListener("click", () => supprimer(s));
        td.append(modif, suppr);
        tr.appendChild(td);
        corps.appendChild(tr);
      });

      $("vide").hidden = lignes.length > 0;
      const enCours = donnees.filter((x) => situationDe(x) === "en_cours").length;
      $("compteur").textContent = lignes.length + " enregistrement(s) affiché(s) sur " + donnees.length + " · " + enCours + " stage(s) en cours";
    }

    ["recherche", "date-debut", "date-fin", "filtre-situation"].forEach((id) => $(id).addEventListener("input", afficherTableau));
    $("btn-effacer").addEventListener("click", () => {
      $("recherche").value = "";
      $("date-debut").value = "";
      $("date-fin").value = "";
      $("filtre-situation").value = "";
      afficherTableau();
    });
    $("btn-actualiser").addEventListener("click", charger);

    /* ---------- Modification ---------- */
    function ouvrirEdition(s) {
      idEdition = s.id;
      $("e-nom").value = s.nom_prenoms;
      $("e-filiere").value = s.filiere;
      $("e-niveau").value = s.niveau || "";
      $("e-universite").value = s.universite || "";
      $("e-type").value = s.type_stage;
      $("e-debut").value = s.date_debut;
      $("e-fin").value = s.date_fin;
      $("e-but").value = s.but_stage;
      $("dialogue").showModal();
    }
    $("e-annuler").addEventListener("click", () => $("dialogue").close());

    $("form-edition").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await db.from("stages").update({
        nom_prenoms: $("e-nom").value.trim(),
        filiere: $("e-filiere").value.trim(),
        niveau: $("e-niveau").value || null,
        universite: $("e-universite").value.trim() || null,
        type_stage: $("e-type").value.trim(),
        date_debut: $("e-debut").value,
        date_fin: $("e-fin").value,
        but_stage: $("e-but").value.trim()
      }).eq("id", idEdition);
      $("dialogue").close();
      if (error) {
        console.error(error);
        dire("msg-admin", messageErreur(error), "erreur");
        return;
      }
      dire("msg-admin", "Modification enregistrée.", "ok");
      charger();
    });

    /* ---------- Suppression ---------- */
    async function supprimer(s) {
      if (!confirm("Supprimer le stage de " + s.nom_prenoms + " (" + dateFr(s.date_debut) + " - " + dateFr(s.date_fin) + ") ?")) return;
      const { error } = await db.from("stages").delete().eq("id", s.id);
      if (error) {
        console.error(error);
        dire("msg-admin", "La suppression a échoué.", "erreur");
        return;
      }
      dire("msg-admin", "Enregistrement supprimé.", "ok");
      charger();
    }

    /* ---------- Export CSV (ouvre dans Excel) ---------- */
    function csv(v) {
      let t = String(v ?? "");
      if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; // évite l'exécution de formules dans Excel
      return '"' + t.replace(/"/g, '""') + '"';
    }

    $("btn-export").addEventListener("click", () => {
      const entete = ["Nom et prénoms", "Université", "Filière", "Niveau de formation", "Type de stage", "Date de début", "Date de fin", "Situation", "Objectif de stage", "Compte créé"];
      const rows = lignesFiltrees().map((s) =>
        [s.nom_prenoms, s.universite || "", s.filiere, s.niveau || "", s.type_stage, dateFr(s.date_debut), dateFr(s.date_fin), SITUATIONS[situationDe(s)][0], s.but_stage, s.user_id ? "Oui" : "Non"]
          .map(csv).join(";")
      );
      const contenu = "\ufeff" + [entete.map(csv).join(";"), ...rows].join("\r\n");
      const blob = new Blob([contenu], { type: "text/csv;charset=utf-8" });
      const lien = document.createElement("a");
      lien.href = URL.createObjectURL(blob);
      lien.download = "stages_" + aujourdhui() + ".csv";
      lien.click();
      URL.revokeObjectURL(lien.href);
    });

    setInterval(() => { if (!$("vue-admin").hidden && !$("dialogue").open) charger(); }, 60000);
    afficherSelonSession();
  </script>
</body>
</html>
